[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydownloader"
version = "0.0.0.dev0"
description = "Windows HLS/DASH/MP4 video grabber with an in-app browser sniffer"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "flynet" }]
dependencies = [
    "PySide6>=6.7",
    "playwright>=1.44",
    "httpx>=0.27",
    "cryptography>=42",
    "lxml>=5.0",
    "packaging>=24",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pydownloader"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# The interface and the log messages are Russian, so Cyrillic letters are not
# reported as confusable with Latin ones.
allowed-confusables = ["а", "б", "в", "г", "д", "е", "ё", "ж", "з", "и", "й", "к", "л", "м", "н",
    "о", "п", "р", "с", "т", "у", "ф", "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я",
    "А", "Б", "В", "Г", "Д", "Е", "Ё", "Ж", "З", "И", "Й", "К", "Л", "М", "Н", "О", "П", "Р",
    "С", "Т", "У", "Ф", "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э", "Ю", "Я"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["lxml.*", "imageio_ffmpeg.*", "pytestqt.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
