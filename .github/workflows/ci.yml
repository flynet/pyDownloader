name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system ".[dev]"

      - name: ruff
        run: ruff check src tests

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest
